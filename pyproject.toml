[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "algo-trading"
version = "1.0.0"
description = "Modular algorithmic trading system with live trading, backtesting, and real-time monitoring"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "requests>=2.31",
    "websockets>=12.0",
    "transformers>=4.35",
    "torch>=2.1",
    "sentencepiece>=0.1.99",
    "streamlit>=1.30",
    "plotly>=5.18",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "pytest-asyncio>=0.23",
]

[project.scripts]
algo-trade = "main:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.setuptools.packages.find]
where = ["."]
